<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 智能灌溉 · MQTT</title>
    <style>
        *{ box-sizing:border-box; font-family: Arial, "Microsoft YaHei", sans-serif; }

        body{
            margin:0; min-height:100vh;
            display:flex; justify-content:center; align-items:center;
            background: linear-gradient(135deg, #bfdbfe, #93c5fd);
        }

        .card{
            width:95%; max-width:960px;
            background:white;
            padding:30px;
            border-radius:20px;
            text-align:center;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
        }

        .topbar{
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:8px;
        }

        .mode-badge{
            font-size:12px; font-weight:bold; color:#1d4ed8;
            background:#dbeafe; border:1px solid #bfdbfe;
            padding:4px 12px; border-radius:999px;
        }

        .conn-status{
            font-size:12px; font-weight:bold;
            padding:4px 12px; border-radius:999px;
            background:#fee2e2; color:#b91c1c;
        }
        .conn-status.connected{ background:#dcfce7; color:#15803d; }
        .conn-status.reconnecting{ background:#fef3c7; color:#b45309; }

        .switch-btn{
            font-size:13px; font-weight:bold; color:#1d4ed8;
            background:white; border:1px solid #93c5fd;
            padding:8px 16px; border-radius:10px;
            text-decoration:none; cursor:pointer;
            transition: all .2s;
        }
        .switch-btn:hover{ background:#eff6ff; }

        h1{ margin-top:10px; color:#1e3a8a; }
        .icon{ font-size:60px; margin:10px; }

        /* 传感器卡片(蓝色系) */
        .sensors{
            display:flex; justify-content:center; gap:14px; flex-wrap:wrap;
            margin:10px 0 25px;
        }
        .sensor-item{
            flex:1 1 120px; max-width:200px;
            background:#eff6ff; border:1px solid #bfdbfe;
            border-radius:12px; padding:12px;
            font-size:15px; color:#1e3a8a;
        }
        .sensor-item span{
            display:block; font-size:26px; font-weight:bold; margin-top:4px;
        }

        .update-time{ font-size:12px; color:#64748b; margin-bottom:6px; }



        /* 控制模式栏: 手动/自动切换(发布 MQTT 指令) */
        .mode-bar{

            display:flex;
            justify-content:center;
            align-items:center;
            gap:12px;
            flex-wrap:wrap;
            margin-bottom:20px;
            padding:10px;
            background:#eff6ff;
            border:1px solid #bfdbfe;
            border-radius:12px;

        }



        .mode-label{

            font-size:14px;
            font-weight:bold;
            color:#1e3a8a;

        }



        .mode-btn{

            width:auto;
            padding:8px 18px;
            margin:0;
            font-size:14px;
            border-radius:10px;

        }



        .mode-btn.active{

            outline:3px solid rgba(29,78,216,.35);

        }

        #channels{ display:flex; flex-wrap:wrap; justify-content:center; gap:14px; }
        .channel{
            flex:1 1 260px; max-width:320px;
            border:1px solid #e2e8f0; border-radius:12px; padding:16px;
            text-align:center;
        }
        .channel-title{ font-size:16px; font-weight:bold; color:#1e3a8a; margin-bottom:10px; }
        .pin{ font-size:12px; font-weight:normal; color:#64748b; }
        .status{ margin:12px 0; padding:12px; border-radius:12px; font-size:18px; }
        .running{ color:#15803d; background:#dcfce7; }
        .stopped{ color:#b91c1c; background:#fee2e2; }
        .pending{ color:#b45309; background:#fef3c7; }

        button{
            width:100%; padding:14px; margin:8px 0;
            border:none; border-radius:12px; font-size:18px;
            color:white; cursor:pointer;
        }
        .on{ background:#22c55e; }
        .off{ background:#ef4444; }
        button:active{ transform:scale(.97); }

        .info{ margin-top:15px; font-size:13px; color:#64748b; }
    </style>
</head>
<body>

<div class="card">

    <div class="topbar">
        <span class="mode-badge">🌐 MQTT 模式</span>
        <span class="conn-status" id="connStatus">连接中...</span>
        <a href="/irrigation" class="switch-btn">← 切换 HTTP 版</a>
    </div>

    <h1>🌐 智能灌溉 · MQTT</h1>
    <div class="icon">📡</div>

    <!-- 传感器卡片: 由 MQTT 消息实时更新 -->
    <div class="sensors">
        <div class="sensor-item">🌡️ 温度<span id="temp">--</span></div>
        <div class="sensor-item">💧 湿度<span id="hum">--</span></div>
        <div class="sensor-item">🪴 土壤<span id="soil">--</span></div>
    </div>
    <div class="update-time">最后数据: <span id="updateTime">--</span></div>


    <!-- 控制模式: 手动/自动切换(发布 MQTT 指令) -->
    <div class="mode-bar">
        <span class="mode-label">当前模式: <span id="mode">--</span></span>
        <button class="on mode-btn" id="btn-auto" onclick="switchMode('auto')">🤖 自动灌溉</button>
        <button class="off mode-btn" id="btn-manual" onclick="switchMode('manual')">🖐 手动控制</button>
    </div>

    <!-- 通道控制: 发布 MQTT 指令, 不经过 ESP32 WebServer -->
    <div id="channels"></div>

    <div class="info">纯 MQTT 通道 · WebSocket 直连 EMQX Broker · 数据实时推送</div>

</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>

    // ===== MQTT 连接配置(与 ESP32 同一 Broker, 主题沿用) =====
    const MQTT_CONF = {
        url:      "wss://i3daab3b.ala.cn-shenzhen.emqxsl.cn:8084/mqtt",
        username: "html",
        password: "131575",
        clientId: "web-mqtt-" + Math.random().toString(16).substr(2, 8),
        topicData: "garden/esp32-s3/data",   // 订阅: 传感器数据
        topicCmd:  "garden/esp32-s3/cmd"     // 发布: 控制指令
    };

    // 通道列表(纯 MQTT 页面不依赖 HTTP API, 固定与本项目一致)
    const CHANNELS = [
        { index: 0, gpioPin: 1 },
        { index: 1, gpioPin: 4 },
        { index: 2, gpioPin: 8 }
    ];

    let client = null;

    // ===== 连接状态显示 =====
    function setConnState(state) {
        const el = document.getElementById("connStatus");
        el.className = "conn-status " + state;
        const text = { connected: "● 已连接 Broker", reconnecting: "↻ 重连中...", disconnected: "✕ 已断开" };
        el.textContent = text[state] || state;
    }

    // ===== 连接 Broker =====
    function connectMqtt() {
        client = mqtt.connect(MQTT_CONF.url, {
            username: MQTT_CONF.username,
            password: MQTT_CONF.password,
            clientId: MQTT_CONF.clientId
        });

        client.on("connect", () => {
            setConnState("connected");
            client.subscribe(MQTT_CONF.topicData);
        });
        client.on("reconnect", () => setConnState("reconnecting"));
        client.on("close", () => setConnState("disconnected"));

        // 收到数据主题消息 → 更新传感器卡片
        client.on("message", (topic, payload) => {
            if (topic === MQTT_CONF.topicData) {
                try {
                    const data = JSON.parse(payload.toString());
                    document.getElementById("temp").textContent =
                        (data.temperature != null) ? data.temperature.toFixed(1) : "--";
                    document.getElementById("hum").textContent =
                        (data.humidity != null) ? data.humidity.toFixed(1) : "--";
                    document.getElementById("soil").textContent =
                        (data.soil != null) ? data.soil : "--";
                    document.getElementById("updateTime").textContent =
                        new Date().toLocaleTimeString();

                    // 更新控制模式显示
                    if (data.mode) {
                        let isManual = (data.mode === "manual");
                        document.getElementById("mode").textContent = isManual ? "🖐 手动" : "🤖 自动";
                        document.getElementById("btn-auto").classList.toggle("active", !isManual);
                        document.getElementById("btn-manual").classList.toggle("active", isManual);
                    }

                    // 更新各通道状态(真实状态, 来自设备上报, 覆盖本地乐观更新)
                    if (data.channels) {
                        data.channels.forEach(ch => {
                            const box = document.getElementById("status-" + ch.index);
                            if (!box) return;
                            if (ch.status) {
                                box.textContent = "💧 灌溉运行中";
                                box.className = "status running";
                            } else {
                                box.textContent = "⛔ 灌溉已停止";
                                box.className = "status stopped";
                            }
                        });
                    }
                } catch (e) { console.log("JSON 解析失败", e); }
            }
        });
    }

    // ===== 渲染通道控制(发布 MQTT 指令) =====
    function renderChannels() {
        const container = document.getElementById("channels");
        CHANNELS.forEach(ch => {
            const div = document.createElement("div");
            div.className = "channel";
            div.innerHTML =
                '<div class="channel-title">通道 ' + ch.index +
                ' <span class="pin">GPIO ' + ch.gpioPin + '</span></div>' +
                '<div class="status stopped" id="status-' + ch.index + '">⛔ 未灌溉</div>' +
                '<button class="on" onclick="sendCmd(' + ch.index + ', \'on\')">开启灌溉</button>' +
                '<button class="off" onclick="sendCmd(' + ch.index + ', \'off\')">停止灌溉</button>';
            container.appendChild(div);
        });
    }

    // ===== 发布控制指令 {"pump":"on/off","index":N} =====
    function sendCmd(index, pump) {
        if (!client || !client.connected) {
            alert("MQTT 未连接, 无法发送指令");
            return;
        }
        const payload = JSON.stringify({ pump: pump, index: index });
        client.publish(MQTT_CONF.topicCmd, payload);

        // 本地乐观更新状态框(实际状态以设备为准)
        const box = document.getElementById("status-" + index);
        if (pump === "on") {
            box.textContent = "💧 灌溉运行中(指令已发)";
            box.className = "status running";
        } else {
            box.textContent = "⛔ 灌溉已停止(指令已发)";
            box.className = "status stopped";
        }
    }

    // ===== 切换控制模式: 发布 {"mode":"auto"/"manual"} =====
    function switchMode(mode) {
        if (!client || !client.connected) {
            alert("MQTT 未连接, 无法切换模式");
            return;
        }
        client.publish(MQTT_CONF.topicCmd, JSON.stringify({ mode: mode }));

        // 乐观更新: 立即本地切换显示(实际以设备后续上报为准)
        let isManual = (mode === "manual");
        document.getElementById("mode").textContent = isManual ? "🖐 手动" : "🤖 自动";
        document.getElementById("btn-auto").classList.toggle("active", !isManual);
        document.getElementById("btn-manual").classList.toggle("active", isManual);
    }

    // ===== 初始化 =====
    renderChannels();
    connectMqtt();

</script>
</body>
</html>
