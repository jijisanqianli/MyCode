<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32 智能灌溉</title>

    <!-- 历史曲线图库 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>


    <style>

        *{
            box-sizing:border-box;
            font-family:
                    Arial,
                    "Microsoft YaHei",
                    sans-serif;
        }


        body{

            margin:0;
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
                    linear-gradient(
                            135deg,
                            #d9f99d,
                            #86efac
                    );

        }


        .card{

            width:95%;
            max-width:960px;

            background:white;

            padding:30px;

            border-radius:20px;

            text-align:center;

            box-shadow:
                    0 10px 30px rgba(0,0,0,.15);

        }



        h1{

            margin-top:0;

            color:#166534;

        }



        /* 顶部栏: 模式徽章 + 切换按钮 */
        .topbar{

            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:10px;

        }



        .mode-badge{

            font-size:12px;
            font-weight:bold;
            color:#166534;
            background:#dcfce7;
            border:1px solid #bbf7d0;
            padding:4px 12px;
            border-radius:999px;

        }



        .switch-btn{

            font-size:13px;
            font-weight:bold;
            color:#15803d;
            background:white;
            border:1px solid #86efac;
            padding:8px 16px;
            border-radius:10px;
            text-decoration:none;
            cursor:pointer;
            transition: all .2s;

        }



        .switch-btn:hover{

            background:#f0fdf4;

        }



        .icon{

            font-size:60px;

            margin:15px;

        }



        /* 传感器数据卡片 */
        .sensors{

            display:flex;
            justify-content:center;
            gap:14px;
            flex-wrap:wrap;
            margin:10px 0 25px;

        }



        /* 控制模式栏: 手动/自动切换 */
        .mode-bar{

            display:flex;
            justify-content:center;
            align-items:center;
            gap:12px;
            flex-wrap:wrap;
            margin-bottom:20px;
            padding:10px;
            background:#f0fdf4;
            border:1px solid #bbf7d0;
            border-radius:12px;

        }



        .mode-label{

            font-size:14px;
            font-weight:bold;
            color:#166534;

        }



        .mode-btn{

            width:auto;
            padding:8px 18px;
            margin:0;
            font-size:14px;
            border-radius:10px;

        }



        .mode-btn.active{

            outline:3px solid rgba(22,163,74,.35);

        }



        .sensor-item{

            flex:1 1 120px;
            max-width:200px;

            background:#f0fdf4;
            border:1px solid #bbf7d0;
            border-radius:12px;
            padding:12px;

            font-size:15px;
            color:#166534;

        }



        .sensor-item span{

            display:block;
            font-size:26px;
            font-weight:bold;
            margin-top:4px;

        }


        /* 通道容器:横向排列,窄屏自动换行 */
        #channels{

            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:14px;

        }


        /* 每个通道的控制区块 */
        .channel{

            flex:1 1 260px;
            max-width:320px;

            border:1px solid #e5e7eb;

            border-radius:12px;

            padding:16px;

            text-align:center;

        }



        .channel-title{

            font-size:16px;

            font-weight:bold;

            color:#166534;

            margin-bottom:10px;

        }



        .pin{

            font-size:12px;

            font-weight:normal;

            color:#666;

        }



        .status{

            margin:12px 0;

            padding:12px;

            border-radius:12px;

            font-size:18px;

        }



        .running{

            color:#16a34a;

            background:#dcfce7;

        }



        .stopped{

            color:#dc2626;

            background:#fee2e2;

        }



        button{

            width:100%;

            padding:14px;

            margin:8px 0;

            border:none;

            border-radius:12px;

            font-size:18px;

            color:white;

            cursor:pointer;

        }



        .on{

            background:#22c55e;

        }



        .off{

            background:#ef4444;

        }



        .check{

            background:#3b82f6;

        }



        button:active{

            transform:scale(.97);

        }



        /* 历史曲线卡片 */
        .chart-box{

            margin-top:25px;
            padding:16px;
            background:#f0fdf4;
            border:1px solid #bbf7d0;
            border-radius:12px;
            text-align:left;

        }



        .chart-box h3{

            margin:0 0 10px;
            font-size:16px;
            color:#166534;

        }



        /* 固定高度容器: 防止 Chart.js responsive 模式下
           canvas 与容器互相撑开导致高度无限膨胀 */
        .chart-wrap{

            position:relative;
            height:300px;

        }



        #historyChart{

            width:100% !important;
            height:100% !important;

        }



        .info{

            margin-top:15px;

            font-size:13px;

            color:#666;

        }



    </style>

</head>



<body>


<div class="card">


    <div class="topbar">
        <span class="mode-badge">🌱 HTTP 模式</span>
        <a href="/irrigation-mqtt" class="switch-btn">切换 MQTT 版 →</a>
    </div>


    <h1>
        🌱 智能灌溉
    </h1>

    <div class="icon">
        💧
    </div>


    <!-- 传感器数据卡片: 由 JS 每 2s 轮询 /api/sensors 更新 -->
    <div class="sensors">
        <div class="sensor-item">🌡️ 温度<span id="temp">--</span></div>
        <div class="sensor-item">💧 湿度<span id="hum">--</span></div>
        <div class="sensor-item">🪴 土壤<span id="soil">--</span></div>
    </div>


    <!-- 控制模式: 手动/自动切换(POST /irrigation/mode) -->
    <div class="mode-bar">
        <span class="mode-label">当前模式: <span id="mode">--</span></span>
        <button class="on mode-btn" id="btn-auto" onclick="switchMode('auto')">🤖 自动灌溉</button>
        <button class="off mode-btn" id="btn-manual" onclick="switchMode('manual')">🖐 手动控制</button>
    </div>


    <!-- 通道列表由 JS 按 /irrigation/channels 返回的数据动态生成 -->
    <div id="channels"></div>


    <!-- 历史数据曲线: Chart.js 绘制 /api/history -->
    <div class="chart-box">
        <h3>📈 历史数据(2s 采样 · 最近约 1 小时)</h3>
        <div class="chart-wrap"><canvas id="historyChart"></canvas></div>
    </div>


    <div class="info">
        ESP32 Irrigation Controller
    </div>


</div>



<script>


    // 缓存通道列表,每个通道的 index 即后端通道索引
    let channels = [];


    // 初始化:加载通道列表,渲染界面并同步一次状态
    async function loadChannels(){

        let container = document.getElementById("channels");

        try{

            let response = await fetch("/irrigation/channels");

            if(!response.ok){
                throw new Error("bad status");
            }

            channels = await response.json();
            renderChannels();
            updateStatus();

        }catch(e){

            container.innerHTML =
                '<div class="status stopped">无法连接 ESP32</div>';

        }

    }


    // 按通道列表动态生成每个通道的 状态框 + 按钮组
    function renderChannels(){

        let container = document.getElementById("channels");
        container.innerHTML = "";

        channels.forEach((ch, i) => {

            let name = ch.name ? ch.name : ("通道 " + ch.index);

            let div = document.createElement("div");
            div.className = "channel";

            div.innerHTML =
                '<div class="channel-title">' + name +
                ' <span class="pin">GPIO ' + ch.gpioPin + '</span></div>' +

                '<div class="status stopped" id="status-' + i + '">状态未知</div>' +

                '<button class="on" onclick="control(' + i + ', true)">开启灌溉</button>' +
                '<button class="off" onclick="control(' + i + ', false)">停止灌溉</button>' +
                '<button class="check" onclick="queryStatus(' + i + ')">查询状态</button>';

            container.appendChild(div);

        });

    }


    // 控制指定通道的开启/停止
    async function control(index, enable){

        let url =
            (enable ? "/irrigation/on?channel=" : "/irrigation/off?channel=")
            + index;

        try{

            let response = await fetch(url, {method:"POST"});
            let text = await response.text();

            alert(text);

            // 操作后自动刷新状态
            updateStatus();

        }catch(e){

            alert("连接 ESP32 失败");

        }

    }


    // 批量刷新所有通道状态(自动更新用)
    async function updateStatus(){

        try{

            let response = await fetch("/irrigation/status");

            if(!response.ok)
                return;

            let data = await response.json();   // 后端返回数组,按通道 index 顺序排列

            data.forEach((item, i) => {
                showStatus(i, item.status);
            });

        }catch(e){

            console.log("状态查询失败");

        }

    }


    // 更新单个通道的状态显示
    function showStatus(index, status){

        let box = document.getElementById("status-" + index);
        if(!box) return;

        if(status){
            box.innerHTML = "💧 灌溉运行中";
            box.className = "status running";
        }else{
            box.innerHTML = "⛔ 灌溉已停止";
            box.className = "status stopped";
        }

    }


    // 手动查询单个通道状态,弹窗显示 GPIO + 状态
    async function queryStatus(index){

        try{

            let response = await fetch("/irrigation/status?channel=" + index);

            if(!response.ok){
                alert("状态查询失败");
                return;
            }

            let data = await response.json();

            let state = data.status ? "运行中" : "已停止";

            alert(
                "GPIO引脚: " + data.gpioPin +
                "\n\n当前状态: " + state
            );

            // 同时刷新页面状态
            showStatus(index, data.status);

        }catch(e){

            alert("无法连接 ESP32");

        }

    }


    // 打开页面自动加载通道并同步一次状态
    loadChannels();


    // 轮询传感器数据(/api/sensors), 每 2s 刷新卡片
    async function updateSensors(){

        try{

            let response = await fetch("/api/sensors");

            if(!response.ok)
                return;

            let data = await response.json();

            document.getElementById("temp").textContent =
                (data.temperature != null) ? data.temperature.toFixed(1) : "--";

            document.getElementById("hum").textContent =
                (data.humidity != null) ? data.humidity.toFixed(1) : "--";

            document.getElementById("soil").textContent =
                (data.soil != null) ? data.soil : "--";

            // 更新控制模式显示(manual 切手动按钮高亮)
            let isManual = (data.mode === "manual");
            document.getElementById("mode").textContent = isManual ? "🖐 手动" : "🤖 自动";
            document.getElementById("btn-auto").classList.toggle("active", !isManual);
            document.getElementById("btn-manual").classList.toggle("active", isManual);

        }catch(e){

            console.log("传感器查询失败");

        }

    }



    // 切换控制模式: POST /irrigation/mode?mode=auto|manual
    async function switchMode(mode){

        try{

            let response = await fetch("/irrigation/mode?mode=" + mode, {method:"POST"});

            if(!response.ok){
                alert("模式切换失败");
                return;
            }

            // 稍后轮询自动刷新模式显示
            updateSensors();

        }catch(e){

            alert("连接 ESP32 失败");

        }

    }

    updateSensors();
    setInterval(updateSensors, 2000);

    // 定时轮询灌溉状态(自动灌溉/云端指令改变状态也能及时反映)
    setInterval(updateStatus, 2000);


    // ===== 历史曲线: 拉取 /api/history 绘制温度/湿度/土壤 =====
    let historyChart = null;

    async function updateHistory(){

        try{

            let response = await fetch("/api/history?limit=300");

            if(!response.ok)
                return;

            let data = await response.json();

            if(data.length === 0)
                return;

            let labels = data.map(p => {
                let d = new Date(p.ts);
                return d.toLocaleTimeString();
            });

            if(historyChart)
                historyChart.destroy();

            historyChart = new Chart(document.getElementById("historyChart"), {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [
                        { label: "温度 °C", data: data.map(p => p.t), borderColor: "#ef4444", backgroundColor: "rgba(239,68,68,.08)", tension: .3, pointRadius: 1 },
                        { label: "湿度 %", data: data.map(p => p.h), borderColor: "#3b82f6", backgroundColor: "rgba(59,130,246,.08)", tension: .3, pointRadius: 1 },
                        { label: "土壤 %", data: data.map(p => p.s), borderColor: "#22c55e", backgroundColor: "rgba(34,197,94,.08)", tension: .3, pointRadius: 1 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 100 }
                    },
                    plugins: { legend: { position: "top" } }
                }
            });

        }catch(e){

            console.log("历史数据获取失败");

        }

    }

    // 历史曲线每 10s 刷新
    updateHistory();
    setInterval(updateHistory, 10000);


</script>


</body>

</html>
